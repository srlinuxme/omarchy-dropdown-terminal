# Dedicated tmux config for the dropdown terminal only. Loaded explicitly via
# `tmux -f this-file new -s dropterm` the first time the session is created;
# never touches the user's own ~/.tmux.conf or any other tmux session.
#
# Gives the dropdown terminal "tabs": each tab is a tmux window with its own
# independent shell (own cwd, scrollback, running programs) inside the same
# persistent session, switchable without the tmux prefix key so it feels like
# a normal terminal-emulator tab strip.

set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-style "bg=#1e1e2e,fg=#a6adc8"
set -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g window-status-separator ""
set -g status-left ""
set -g status-right ""

# Tab management without the tmux prefix key.
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w kill-window
bind -n M-Right next-window
bind -n M-Left previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
